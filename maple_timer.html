<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍁 楓之谷 60頻道團隊共享計時器 (絕對自動循環版)</title>
    <style>
        :root {
            --primary: #ff9f43;
            --primary-hover: #ee5253;
            --bg-dark: #222f3e;
            --text-light: #c8d6e5;
            --danger: #ff6b6b;
            --success: #1dd1a1;
        }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #1e272e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (min-width: 768px) {
            .grid { grid-template-columns: 1fr 2fr; }
        }
        .card {
            background-color: var(--bg-dark);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-top: 4px solid var(--primary);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #576574;
            padding-bottom: 10px;
            color: var(--text-light);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #b2bec3;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #2f3542;
            border: 1px solid #57606f;
            border-radius: 6px;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 1rem;
        }
        button:hover { background-color: var(--primary-hover); }
        button.btn-secondary { background-color: #576574; }
        button.btn-danger { background-color: var(--danger); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: var(--bg-dark);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #341f97;
        }
        th {
            background-color: #341f97;
            color: #ffffff;
            font-weight: 600;
        }
        tr:hover { background-color: rgba(255,255,255,0.05); }
        .status-imminent {
            color: var(--danger);
            font-weight: bold;
        }
        .status-ready {
            color: var(--success);
            font-weight: bold;
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 0.85rem;
            margin-right: 5px;
        }
        .time-adjust-panel {
            background: #2f3542;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <button type="button" class="btn-secondary" style="width: 100%; margin-bottom: 15px; background-color: #10ac84;" onclick="alert('🎉 測試成功！計時器網頁按鈕完全復活，通電順暢！')">🔍 點我測試按鈕是否復活</button>

    <h1>🍁 楓之谷 60頻道團隊共享計時器 (無限自動循環版)</h1>

    <div class="grid">
        <div class="sidebar">
            <div class="card form-group">
                <h2>⚔️ 新增 / 更新擊殺紀錄</h2>
                <div class="form-group">
                    <label>BOSS 名稱</label>
                    <select id="bossName" onchange="onBossSelect()">
                        <option value="紅寶王">紅寶王 (固定45分)</option>
                        <option value="蜈蚣王">蜈蚣王 (固定45分)</option>
                        <option value="自訂王">自訂 BOSS...</option>
                    </select>
                </div>
                <div class="form-group" id="customBossBlock" style="display: none;">
                    <label>自訂 BOSS 名稱</label>
                    <input type="text" id="customBossName" value="樹妖王">
                </div>
                <div class="form-group">
                    <label>頻道 (1-60)</label>
                    <input type="number" id="bossCh" value="1" min="1" max="60">
                </div>
                <div class="form-group">
                    <label>CD 時間 (分鐘)</label>
                    <input type="number" id="bossCd" value="45" min="1">
                </div>
                <div class="form-group">
                    <label>⏱️ 擊殺時間點調整 (回報過去擊殺)</label>
                    <button type="button" style="width:100%; margin-bottom:8px;" onclick="getNowTime()">⚡ 就是現在 (帶入當下電腦時間)</button>
                    <div class="time-adjust-panel">
                        <label style="font-size:0.85rem;">手動指定時間 (時:分)：</label>
                        <input type="time" id="killTimeInput">
                    </div>
                </div>
                <button type="button" style="width: 100%; background-color: #ff9f43;" onclick="addTimer()">➕ 紀錄 / 加入無限倒數王表</button>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h2>👥 團隊數據同步與共享</h2>
                <textarea id="syncCode" rows="3" placeholder="複製下方的文字貼給隊友..."></textarea>
                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="exportData()">📋 複製我的代碼</button>
                    <button type="button" onclick="importData()">📥 匯入隊友代碼</button>
                </div>
                <button type="button" class="btn-danger" style="width:100%; margin-top:10px; padding:8px; font-size:0.9rem;" onclick="clearAll()">⚠️ 清空所有紀錄</button>
            </div>
        </div>

        <div class="main-content">
            <div class="card" style="height: 100%; overflow-x: auto;">
                <h2>📅 目前追王時間面板 (時間到自動跳下一輪)</h2>
                <table>
                    <thead>
                        <tr>
                            <th>BOSS 名稱</th>
                            <th>頻道</th>
                            <th>重生週期</th>
                            <th>最後擊殺</th>
                            <th>預計重生</th>
                            <th>剩餘倒數時間</th>
                            <th>快速操作</th>
                        </tr>
                    </thead>
                    <tbody id="timerData">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    var bossList = [
        {
            name: "紅寶王(預設測試)",
            ch: 1,
            cd: 45,
            killTimestamp: new Date().getTime()
        }
    ];

    setTimeout(function() {
        getNowTime();
    }, 50);

    setInterval(function() {
        var nowTimestamp = new Date().getTime();
        
        for (var i = 0; i < bossList.length; i++) {
            var item = bossList[i];
            var cdMs = item.cd * 60000;
            var respawnTimestamp = item.killTimestamp + cdMs;
            
            while (nowTimestamp >= respawnTimestamp) {
                item.killTimestamp = respawnTimestamp;
                respawnTimestamp = item.killTimestamp + cdMs;
            }
        }
        updateTable();
    }, 1000);

    function onBossSelect() {
        var bossSel = document.getElementById('bossName').value;
        var cdInput = document.getElementById('bossCd');
        var customBlock = document.getElementById('customBossBlock');
        
        if (bossSel === '紅寶王' || bossSel === '蜈蚣王') {
            cdInput.value = 45;
            customBlock.style.display = 'none';
        } else {
            customBlock.style.display = 'block';
        }
    }

    function getNowTime() {
        var now = new Date();
        var hrs = now.getHours();
        var mins = now.getMinutes();
        if (hrs < 10) hrs = "0" + hrs;
        if (mins < 10) mins = "0" + mins;
        var inputEl = document.getElementById('killTimeInput');
        if (inputEl) {
            inputEl.value = hrs + ":" + mins;
        }
    }

    function addTimer() {
        var bossSel = document.getElementById('bossName').value;
        var finalName = bossSel;
        if (bossSel === '自訂王') {
            finalName = document.getElementById('customBossName').value.trim();
        }
        
        var chNum = parseInt(document.getElementById('bossCh').value, 10);
        var cdNum = parseInt(document.getElementById('bossCd').value, 10);
        var timeStr = document.getElementById('killTimeInput').value;

        if (!finalName || isNaN(chNum) || isNaN(cdNum) || !timeStr) {
            alert('請填寫完整的欄位！');
            return;
        }

        var tParts = timeStr.split(':');
        var kDate = new Date();
        kDate.setHours(parseInt(tParts[0], 10), parseInt(tParts[1], 10), 0, 0);

        for (var i = bossList.length - 1; i >= 0; i--) {
            if (bossList[i].name === finalName && bossList[i].ch === chNum) {
                bossList.splice(i, 1);
            }
        }

        bossList.push({
            name: finalName,
            ch: chNum,
            cd: cdNum,
            killTimestamp: kDate.getTime()
        });

        updateTable();
    }

    function updateTable() {
        var tbody = document.getElementById('timerData');
        if (!tbody) return;

        if (bossList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#8395a7;">目前暫無追王紀錄，請從左側新增。</td></tr>';
            return;
        }

        var nowTime = new Date().getTime();
        var html = '';

        for (var k = 0; k < bossList.length; k++) {
            var item = bossList[k];
            var respawnTime = item.killTimestamp + (item.cd * 60000);
            var timeLeftMs = respawnTime - nowTime;

            var dKill = new Date(item.killTimestamp);
            var dRespawn = new Date(respawnTime);
            
            var killStr = padZero(dKill.getHours()) + ":" + padZero(dKill.getMinutes());
            var respawnStr = padZero(dRespawn.getHours()) + ":" + padZero(dRespawn.getMinutes());

            var totalSecs = Math.floor(timeLeftMs / 1000);
            var countdownText = '';
            var sClass = '';

            if (totalSecs <= 0) {
                countdownText = "🟢 自動刷新下一輪中...";
            } else {
                var hrs = Math.floor(totalSecs / 3600);
                var mins = Math.floor((totalSecs % 3600) / 60);
                var secs = totalSecs % 60;
                countdownText = (hrs > 0 ? hrs + '時' : '') + mins + '分' + secs + '秒';
                
                if (timeLeftMs < 300000) {
                    sClass = 'status-imminent';
                }
            }

            html += '<tr>' +
                '<td><strong>' + item.name + '</strong></td>' +
                '<td><span style="color:var(--primary)">' + item.ch + ' 頻</span></td>' +
                '<td>' + item.cd + ' 分</td>' +
                '<td>' + killStr + '</td>' +
                '<td>' + respawnStr + '</td>' +
                '<td class="' + sClass + '">' + countdownText + '</td>' +
                '<td>' +
                    '<button class="btn-sm" onclick="quickAction(' + k + ', 1)">+1分</button>' +
                    '<button class="btn-sm" onclick="quickAction(' + k + ', 2)">再殺一次</button>' +
                    '<button class="btn-sm btn-danger" onclick="deleteItem(' + k + ')">刪除</button>' +
                '</td>' +
            '</tr>';
        }

        tbody.innerHTML = html;
    }

    function padZero(num) {
        return num < 10 ? '0' + num : num;
    }

    window.quickAction = function(index, type) {
        if (!bossList[index]) return;
        if (type === 1) {
            bossList[index].killTimestamp += 60000;
        } else if (type === 2) {
            bossList[index].killTimestamp = new Date().getTime();
        }
        updateTable();
    }

    window.deleteItem = function(index) {
        if (confirm("確定要刪除這筆追王紀錄嗎？")) {
            bossList.splice(index, 1);
            updateTable();
        }
    }

    window.exportData = function() {
        if (bossList.length === 0) {
            alert("目前沒有任何數據可以複製。");
            return;
        }
        var area = document.getElementById('syncCode');
        if (area) {
            area.value = JSON.stringify(bossList);
            area.select();
            document.execCommand('copy');
            alert("📋 追王代碼已複製到剪貼簿！快發給群組隊友吧！");
        }
    }

    window.importData = function() {
        var area = document.getElementById('syncCode');
        if (!area) return;
        var code = area.value.trim();
        if (!code) {
            alert("請先貼入隊友的代碼！");
            return;
        }
        try {
            var parsed = JSON.parse(code);
            if (Array.isArray(parsed)) {
                bossList = parsed;
                updateTable();
                area.value = '';
                alert("⚡ 隊友數據匯入對時成功！");
            }
        } catch (e) {
            alert("❌ 匯入失敗，請檢查代碼是否貼完整。");
        }
    }

    window.clearAll = function() {
        if (confirm("確定要清空所有紀錄嗎？")) {
            bossList = [];
            updateTable();
        }
    }
</script>

</body>
</html>
