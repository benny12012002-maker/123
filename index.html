<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍁 楓之谷 60頻道團隊共享計時器 (絕對自動循環版)</title>
    <style>
        :root {
            --primary: #ff9f43;
            --primary-hover: #ee5253;
            --bg-dark: #222f3e;
            --text-light: #c8d6e5;
            --danger: #ff6b6b;
            --success: #1dd1a1;
        }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #1e272e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (min-width: 768px) {
            .grid { grid-template-columns: 1fr 2fr; }
        }
        .card {
            background-color: var(--bg-dark);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-top: 4px solid var(--primary);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #576574;
            padding-bottom: 10px;
            color: var(--text-light);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #b2bec3;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #2f3542;
            border: 1px solid #57606f;
            border-radius: 6px;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 1rem;
        }
        button:hover { background-color: var(--primary-hover); }
        button.btn-secondary { background-color: #576574; }
        button.btn-danger { background-color: var(--danger); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: var(--bg-dark);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #341f97;
        }
        th {
            background-color: #341f97;
            color: #ffffff;
            font-weight: 600;
        }
        tr:hover { background-color: rgba(255,255,255,0.05); }
        .status-imminent {
            color: var(--danger);
            font-weight: bold;
        }
        .status-ready {
            color: var(--success);
            font-weight: bold;
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 0.85rem;
            margin-right: 5px;
        }
        .time-adjust-panel {
            background: #2f3542;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <button type="button" class="btn-secondary" style="width: 100%; margin-bottom: 15px; background-color: #10ac84;" onclick="alert('🎉 測試成功！計時器網頁按鈕完全復活，通電順暢！')">🔍 點我測試按鈕是否復活</button>

    <h1>🍁 楓之谷 60頻道團隊共享計時器 (無限自動循環版)</h1>

    <div class="grid">
        <div class="sidebar">
            <div class="card form-group">
                <h2>⚔️ 新增 / 更新擊殺紀錄</h2>
                <div class="form-group">
                    <label>BOSS 名稱</label>
                    <select id="bossName" onchange="onBossSelect()">
                        <option value="紅寶王">紅寶王 (固定45分)</option>
                        <option value="蜈蚣王">蜈蚣王 (固定45分)</option>
                        <option value="自訂王">自訂 BOSS...</option>
                    </select>
                </div>
                <div class="form-group" id="customBossBlock" style="display: none;">
                    <label>自訂 BOSS 名稱</label>
                    <input type="text" id="customBossName" value="樹妖王">
                </div>
                <div class="form-group">
                    <label>頻道 (1-60)</label>
                    <input type="number" id="bossCh" value="1" min="1" max="60">
                </div>
                <div class="form-group">
                    <label>CD 時間 (分鐘)</label>
                    <input type="number" id="bossCd" value="45" min="1">
                </div>
                <div class="form-group">
                    <label>⏱️ 擊殺時間點調整 (回報過去擊殺)</label>
                    <button type="button" style="width:100%; margin-bottom:8px;" onclick="getNowTime()">⚡ 就是現在 (帶入當下電腦時間)</button>
                    <div class="time-adjust-panel">
                        <label style="font-size:0.85rem;">手動指定時間 (時:分)：</label>
                        <input type="time" id="killTimeInput">
                    </div>
                </div>
                <button type="button" style="width: 100%; background-color: #ff9f43;" onclick="addTimer()">➕ 紀錄 / 加入無限倒數王表</button>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h2>👥 團隊數據同步與共享</h2>
                <textarea id="syncCode" rows="3" placeholder="複製下方的文字貼給隊友..."></textarea>
                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="exportData()">📋 複製我的代碼</button>
                    <button type="button" onclick="importData()">📥 匯入隊友代碼</button>
                </div>
                <button type="button" class="btn-danger" style="width:100%; margin-top:10px; padding:8px; font-size:0.9rem;" onclick="clearAll()">⚠️ 清空所有紀錄</button>
            </div>
        </div>

        <div class="main-content">
            <div class="card" style="height: 100%; overflow-x: auto;">
                <h2>📅 目前追王時間面板 (時間到自動跳下一輪)</h2>
                <table>
                    <thead>
                        <tr>
                            <th>BOSS 名稱</th>
                            <th>頻道</th>
                            <th>重生週期</th>
                            <th>最後擊殺</th>
                            <th>預計重生</th>
                            <th>剩餘倒數時間</th>
                            <th>快速操作</th>
                        </tr>
                    </thead>
                    <tbody id="timerData">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // 讀取本地儲存的資料，若無則建立預設資料
    var bossList = JSON.parse(localStorage.getItem('ms_boss_timers')) || [
        {
            name: "紅寶王(預設測試)",
            ch: 1,
            cd: 45,
            killTimestamp: new Date().getTime()
        }
    ];

    setTimeout(function() {
        getNowTime();
    }, 50);

    // 每秒檢查是否該進入下一輪自動循環計時
    setInterval(function() {
        var nowTimestamp = new Date().getTime();
        var isChanged = false;
        
        for (var i = 0; i < bossList.length; i++) {
            var item = bossList[i];
            var cdMs = item.cd * 60000;
            var respawnTimestamp = item.killTimestamp + cdMs;
            
            while (nowTimestamp >= respawnTimestamp) {
                item.killTimestamp = respawnTimestamp;
                respawnTimestamp = item.killTimestamp + cdMs;
                isChanged = true;
            }
        }
        if (isChanged) saveToStorage();
        updateTable();
    }, 1000);

    // 控制下拉選單切換自訂項目
    function onBossSelect() {
        var bossSel = document.getElementById('bossName').value;
        var cdInput = document.getElementById('bossCd');
        var customBlock = document.getElementById('customBossBlock');
        
        if (bossSel === "自訂王") {
            customBlock.style.display = "block";
            cdInput.value = 60;
        } else {
            customBlock.style.display = "none";
            cdInput.value = 45;
        }
    }

    // 取得現在時間並自動填入時間控制欄位
    function getNowTime() {
        var now = new Date();
        var hours = String(now.getHours()).padStart(2, '0');
        var minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('killTimeInput').value = hours + ':' + minutes;
    }

    // 新增一筆計時器
    function addTimer() {
        var bossSel = document.getElementById('bossName').value;
        var finalName = (bossSel === "自訂王") ? document.getElementById('customBossName').value.trim() : bossSel;
        var ch = parseInt(document.getElementById('bossCh').value) || 1;
        var cd = parseInt(document.getElementById('bossCd').value) || 45;
        var timeStr = document.getElementById('killTimeInput').value;

        if (!finalName) { alert("請輸入 BOSS 名稱！"); return; }
        if (ch < 1 || ch > 60) { alert("頻道只限 1 ~ 60 分流！"); return; }

        var targetDate = new Date();
        if (timeStr) {
            var parts = timeStr.split(':');
            targetDate.setHours(parseInt(parts[0]), parseInt(parts[1]), 0, 0);
            if (targetDate.getTime() > new Date().getTime()) {
                targetDate.setDate(targetDate.getDate() - 1);
            }
        }

        var existIndex = bossList.findIndex(item => item.name === finalName && item.ch === ch);
        var timerObj = {
