<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍁 楓之谷 60頻道團隊共享計時器 (網址一鍵同步版)</title>
    <style>
        :root {
            --primary: #ff9f43;
            --primary-hover: #ee5253;
            --bg-dark: #222f3e;
            --text-light: #c8d6e5;
            --danger: #ff6b6b;
            --success: #1dd1a1;
        }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #1e272e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (min-width: 768px) {
            .grid { grid-template-columns: 1fr 2fr; }
        }
        .card {
            background-color: var(--bg-dark);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-top: 4px solid var(--primary);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #576574;
            padding-bottom: 10px;
            color: var(--text-light);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #b2bec3;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #2f3542;
            border: 1px solid #57606f;
            border-radius: 6px;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 1rem;
        }
        button:hover { background-color: var(--primary-hover); }
        button.btn-secondary { background-color: #576574; }
        button.btn-danger { background-color: var(--danger); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: var(--bg-dark);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #341f97;
        }
        th {
            background-color: #341f97;
            color: #ffffff;
            font-weight: 600;
        }
        tr:hover { background-color: rgba(255,255,255,0.05); }
        .status-imminent {
            color: var(--danger);
            font-weight: bold;
        }
        .status-ready {
            color: var(--success);
            font-weight: bold;
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 0.85rem;
            margin-right: 5px;
        }
        .time-adjust-panel {
            background: #2f3542;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <button type="button" class="btn-secondary" style="width: 100%; margin-bottom: 15px; background-color: #10ac84;" onclick="alert('🎉 測試成功！一鍵同步功能已順利通電！')">🔍 點我測試按鈕是否正常</button>

    <h1>🍁 楓之谷 60頻道團隊共享計時器 (網址一鍵同步版)</h1>

    <div class="grid">
        <!-- 左側操作區 -->
        <div class="sidebar">
            <div class="card form-group">
                <h2>⚔️ 新增 / 更新擊殺紀錄</h2>
                <div class="form-group">
                    <label>BOSS 名稱</label>
                    <select id="bossName" onchange="onBossSelect()">
                        <option value="紅寶王">紅寶王 (固定45分)</option>
                        <option value="蜈蚣王">蜈蚣王 (固定45分)</option>
                        <option value="自訂王">自訂 BOSS...</option>
                    </select>
                </div>
                <div class="form-group" id="customBossBlock" style="display: none;">
                    <label>自訂 BOSS 名稱</label>
                    <input type="text" id="customBossName" value="樹妖王">
                </div>
                <div class="form-group">
                    <label>頻道 (1-60)</label>
                    <input type="number" id="bossCh" value="1" min="1" max="60">
                </div>
                <div class="form-group">
                    <label>CD 時間 (分鐘)</label>
                    <input type="number" id="bossCd" value="45" min="1">
                </div>
                <div class="form-group">
                    <label>⏱️ 擊殺時間點調整 (回報過去擊殺)</label>
                    <button type="button" style="width:100%; margin-bottom:8px;" onclick="getNowTime()">⚡ 就是現在 (帶入當下電腦時間)</button>
                    <div class="time-adjust-panel">
                        <label style="font-size:0.85rem;">手動指定時間 (時:分)：</label>
                        <input type="time" id="killTimeInput">
                    </div>
                </div>
                <button type="button" style="width: 100%; background-color: #ff9f43;" onclick="addTimer()">➕ 紀錄 / 加入無限倒數王表</button>
            </div>

            <!-- 同步區 -->
            <div class="card" style="margin-top: 20px;">
                <h2>👥 團隊一鍵網址同步</h2>
                <p style="font-size: 0.85rem; color: #b2bec3; margin: 0 0 10px 0;">※ 設定好時間後，按下方按鈕複製網址發給朋友，朋友點開直接秒同步！</p>
                <div class="btn-group">
                    <button type="button" style="background-color: #1dd1a1; color: #1e272e;" onclick="exportShareUrl()">📋 一鍵複製「同步網址」發給隊友</button>
                    <button type="button" class="btn-danger" style="margin-top: 10px; padding:8px; font-size:0.9rem;" onclick="clearAll()">⚠️ 清空所有紀錄</button>
                </div>
            </div>
        </div>

        <!-- 右側王表區 -->
        <div class="main-content">
            <div class="card" style="height: 100%; overflow-x: auto;">
                <h2>📅 目前追王時間面板 (時間到自動跳下一輪)</h2>
                <table>
                    <thead>
                        <tr>
                            <th>BOSS 名稱</th>
                            <th>頻道</th>
                            <th>重生週期</th>
                            <th>最後擊殺</th>
                            <th>預計重生</th>
                            <th>剩餘倒數時間</th>
                            <th>快速操作</th>
                        </tr>
                    </thead>
                    <tbody id="timerData">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    var bossList = [];

    // 初始化自動檢查網址有沒有帶數據，並填入當前時間
    window.onload = function() {
        getNowTime();
        checkUrlParams();
        
        // 如果網址沒有帶數據，預設塞一筆測試資料
        if (bossList.length === 0) {
            bossList.push({
                name: "紅寶王(預設測試)",
                ch: 1,
                cd: 45,
                killTimestamp: new Date().getTime()
            });
        }
        updateTable();
    };

    // 每秒核心計時鐘（無限自動循環演算法）
    setInterval(function() {
        var nowTimestamp = new Date().getTime();
        for (var i = 0; i < bossList.length; i++) {
            var item = bossList[i];
            var cdMs = item.cd * 60000;
            var respawnTimestamp = item.killTimestamp + cdMs;
            
            while (nowTimestamp >= respawnTimestamp) {
                item.killTimestamp = respawnTimestamp;
                respawnTimestamp = item.killTimestamp + cdMs;
            }
        }
        updateTable();
    }, 1000);

    // 檢查網址列參數（一鍵匯入的核心技術）
    function checkUrlParams() {
        var urlParams = new URLSearchParams(window.location.search);
        var dataParam = urlParams.get('data');
        if (dataParam) {
            try {
                // 解碼並解析 JSON 數據
                var decodedData = decodeURIComponent(atob(dataParam));
                var parsed = JSON.parse(decodedData);
                if (Array.isArray(parsed)) {
                    bossList = parsed;
                    // 清除網址列的髒參數，維持畫面乾淨
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            } catch (e) {
                console.log("網址無同步數據或解析失敗");
            }
        }
    }

    // 產生並複製帶有資料的同步網址
    function exportShareUrl() {
        if (bossList.length === 0) {
            alert("目前王表空空的，請先新增打王紀錄再複製喔！");
            return;
        }
        try {
            // 將王表轉為純文字並用 Base64 加密塞進網址
            var jsonStr = JSON.stringify(bossList);
            var b64Str = btoa(encodeURIComponent(jsonStr));
            var shareUrl = window.location.origin + window.location.pathname + "?data=" + b64Str;
            
            // 建立一個臨時輸入框來強制作業系統複製
            var tempInput = document.createElement("input");
            tempInput.value = shareUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            
            alert("📋 同步網址已成功複製！快發到 LINE 或 Discord 群組，隊友點開就直接秒對時！");
        } catch (e) {
            alert("複製失敗，請手動複製網址列。");
        }
    }

    function onBossSelect() {
        var bossSel = document.getElementById('bossName').value;
