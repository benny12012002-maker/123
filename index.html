        }
        body {

        }
        .container {

        }
        h1 {

            color: var(--primary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .grid { grid-template-columns: 1fr 1.5fr; }
        }
        .card {
            background-color: var(--bg-dark);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-top: 4px solid var(--primary);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #576574;
            padding-bottom: 10px;
            color: var(--text-light);
        }
        /* 頻道快速按鈕排版 */
        .ch-btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 15px;
        }
        .btn-ch {
            background-color: #2f3542;
            color: white;
            border: 1px solid #57606f;
            padding: 12px 5px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn-ch:hover {
            background-color: var(--primary);
            border-color: var(--primary);
        }
        button {
            cursor: pointer;
            transition: all 0.2s;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: var(--bg-dark);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #341f97;
        }
        th {
            background-color: #341f97;
            color: #ffffff;
            font-weight: 600;
        }
        tr:hover { background-color: rgba(255,255,255,0.05); }
        .status-imminent {
            color: var(--danger);
            font-weight: bold;
        }
        .status-ready {
            color: var(--success);
            font-weight: bold;
        }
        .btn-sm {
            padding: 6px 12px;
            background-color: #576574;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-right: 5px;
        }
        .btn-sm:hover { background-color: #8395a7; }
        .btn-danger-sm { background-color: var(--danger); }
        .btn-danger-sm:hover { background-color: #ee5253; }
    </style>
</head>
<body>

<script>

    // 自動讀取網址帶過來的團隊數據
    checkUrlParams();

    // 啟動定時器，純數字每秒扣 1 秒，時間到（<=0）自動無條件重新填裝 45 分鐘（2700秒）
    setInterval(function() {
        for (var i = 0; i < bossList.length; i++) {
            if (bossList[i].secondsLeft > 0) {
                bossList[i].secondsLeft--;
            } else {
                // 【無限自動循環】：秒數扣完，完全不需要人點，直接原地自動重算下一個 45 分鐘！
                bossList[i].secondsLeft = 2700;
            }
        }
        updateTable();

    updateTable();

    function clickCh(channelNum) {

        for (var i = bossList.length - 1; i >= 0; i--) {
            if (bossList[i].ch === channelNum) {
                bossList.splice(i, 1);
            }
        }

        // 直接把「紅寶王」、「頻道號碼」、以及「45分鐘的秒數(2700秒)」塞進去
        bossList.push({
            name: "紅寶王",
            ch: channelNum,
            secondsLeft: 2700
        });

        updateTable();
    }
