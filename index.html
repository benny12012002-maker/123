<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍁 楓之谷 60頻道團隊共享計時器</title>
    <style>
        :root { --primary: #ff9f43; --primary-hover: #ee5253; --bg-dark: #222f3e; --text-light: #c8d6e5; --danger: #ff6b6b; --success: #1dd1a1; }
        body { font-family: sans-serif; background-color: #1e272e; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary); }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .grid { grid-template-columns: 1fr 2fr; } }
        .card { background-color: var(--bg-dark); border-radius: 12px; padding: 20px; border-top: 4px solid var(--primary); }
        .card h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #576574; padding-bottom: 10px; color: var(--text-light); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #b2bec3; }
        input, select, textarea { width: 100%; padding: 10px; background-color: #2f3542; border: 1px solid #57606f; border-radius: 6px; color: #ffffff; box-sizing: border-box; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #576574; }
        .btn-danger { background-color: var(--danger); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background-color: var(--bg-dark); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #341f97; }
        th { background-color: #341f97; }
        .status-imminent { color: var(--danger); font-weight: bold; }
        .status-ready { color: var(--success); font-weight: bold; }
        .btn-sm { padding: 5px 10px; font-size: 0.85rem; margin-right: 5px; width: auto; }
        .time-adjust-panel { background: #2f3542; padding: 10px; border-radius: 6px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="container">
    <button type="button" class="btn-secondary" style="margin-bottom:15px; background-color:#10ac84;" onclick="alert('🎉 測試成功！按鈕完全復活，通電順暢！')">🔍 點我測試按鈕是否復活</button>
    <h1>🍁 楓之谷 60頻道團隊共享計時器 (無限自動循環版)</h1>
    <div class="grid">
        <div class="sidebar">
            <div class="card form-group">
                <h2>⚔️ 新增 / 更新擊殺紀錄</h2>
                <div class="form-group">
                    <label>BOSS 名稱</label>
                    <select id="bossName" onchange="onBossSelect()">
                        <option value="紅寶王">紅寶王 (固定45分)</option>
                        <option value="蜈蚣王">蜈蚣王 (固定45分)</option>
                        <option value="自訂王">自訂 BOSS...</option>
                    </select>
                </div>
                <div class="form-group" id="customBossBlock" style="display: none;">
                    <label>自訂 BOSS 名稱</label>
                    <input type="text" id="customBossName" value="樹妖王">
                </div>
                <div class="form-group"><label>頻道 (1-60)</label><input type="number" id="bossCh" value="1" min="1" max="60"></div>
                <div class="form-group"><label>CD 時間 (分鐘)</label><input type="number" id="bossCd" value="45" min="1"></div>
                <div class="form-group">
                    <label>⏱️ 擊殺時間點調整</label>
                    <button type="button" style="margin-bottom:8px;" onclick="getNowTime()">⚡ 就是現在 (帶入當下時間)</button>
                    <div class="time-adjust-panel">
                        <label style="font-size:0.85rem;">手動指定時間：</label>
                        <input type="time" id="killTimeInput">
                    </div>
                </div>
                <button type="button" onclick="addTimer()">➕ 紀錄 / 加入無限倒數王表</button>
            </div>
            <div class="card" style="margin-top: 20px;">
                <h2>👥 團隊數據同步與共享</h2>
                <textarea id="syncCode" rows="3" placeholder="複製下方的文字貼給隊友..."></textarea>
                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="exportData()">📋 複製我的代碼</button>
                    <button type="button" onclick="importData()">📥 匯入隊友代碼</button>
                </div>
                <button type="button" class="btn-danger" style="margin-top:10px; padding:8px;" onclick="clearAll()">⚠️ 清空所有紀錄</button>
            </div>
        </div>
        <div class="main-content">
            <div class="card" style="overflow-x: auto;">
                <h2>📅 目前追王時間面板 (時間到自動跳下一輪)</h2>
                <table>
                    <thead>
                        <tr><th>BOSS</th><th>頻道</th><th>週期</th><th>最後擊殺</th><th>預計重生</th><th>剩餘時間</th><th>快速操作</th></tr>
                    </thead>
                    <tbody id="timerData"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    var bossList = JSON.parse(localStorage.getItem('ms_boss_timers')) || [{name: "紅寶王(預設測試)", ch: 1, cd: 45, killTimestamp: new Date().getTime()}];
    setTimeout(getNowTime, 50);
    setInterval(function() {
        var now = new Date().getTime(), changed = false;
        for (var i = 0; i < bossList.length; i++) {
            var item = bossList[i], cdMs = item.cd * 60000, respawn = item.killTimestamp + cdMs;
            while (now >= respawn) { item.killTimestamp = respawn; respawn = item.killTimestamp + cdMs; changed = true; }
        }
        if (changed) saveToStorage();
        updateTable();
    }, 1000);
    function onBossSelect() {
        var sel = document.getElementById('bossName').value, cd = document.getElementById('bossCd'), block = document.getElementById('customBossBlock');
        if (sel === "自訂王") { block.style.display = "block"; cd.value = 60; } else { block.style.display = "none"; cd.value = 45; }
    }
    function getNowTime() {
        var now = new Date();
        document.getElementById('killTimeInput').value = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }
    function addTimer() {
        var sel = document.getElementById('bossName').value, name = (sel === "自訂王") ? document.getElementById('customBossName').value.trim() : sel;
        var ch = parseInt(document.getElementById('bossCh').value) || 1, cd = parseInt(document.getElementById('bossCd').value) || 45, timeStr = document.getElementById('killTimeInput').value;
        if (!name) { alert("請輸入名字"); return; } if (ch < 1 || ch > 60) { alert("頻道1-60"); return; }
        var tDate = new Date();
        if (timeStr) { var p = timeStr.split(':'); tDate.setHours(parseInt(p[0]), parseInt(p[1]), 0, 0); if (tDate.getTime() > new Date().getTime()) tDate.setDate(tDate.getDate() - 1); }
        var idx = bossList.findIndex(i => i.name === name && i.ch === ch), obj = {name: name, ch: ch, cd: cd, killTimestamp: tDate.getTime()};
        if (idx > -1) bossList[idx] = obj; else bossList.push(obj);
        saveToStorage(); updateTable(); alert(`已記錄 ${name} CH${ch}`);
    }
    function updateTable() {
        var tbody = document.getElementById('timerData'); if (!tbody) return;
        var now = new Date().getTime(), sorted = [...bossList].sort((a, b) => (a.killTimestamp + a.cd * 60000) - (b.killTimestamp + b.cd * 60000)), html = "";
        if (sorted.length === 0) html = `<tr><td colspan="7" style="text-align:center;color:#576574;">暫無數據</td></tr>`;
        for (var i = 0; i < sorted.length; i++) {
            var item = sorted[i], respawn = item.killTimestamp + (item.cd * 60000), rem = respawn - now, cls = "", txt = "";
            if (rem <= 0) { txt = "已重生"; cls = "status-ready"; } else { var sec = Math.floor(rem / 1000), m = Math.floor(sec / 60); txt = `${m}分${sec % 60}秒`; if (m < 5) cls = "status-imminent"; }
            var oIdx = bossList.findIndex(o => o.name === item.name && o.ch === item.ch);
            html += `<tr><td><b>${item.name}</b></td><td><span style="color:#ff9f43;">${item.ch} Ch</span></td><td>${item.cd}分</td><td style="color:#a4b0be;">${fmt(item.killTimestamp)}</td><td style="color:#ff9f43;">${fmt(respawn)}</td><td class="${cls}">${txt}</td><td><button class="btn-sm" style="background-color:#10ac84;" onclick="qk(${oIdx})">⚡剛殺</button><button class="btn-sm btn-danger" onclick="del(${oIdx})">🗑️</button></td></tr>`;
        }
        tbody.innerHTML = html;
    }
    function fmt(ts) { var d = new Date(ts); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; }
    function qk(i) { if(i>-1&&bossList[i]) { bossList[i].killTimestamp = new Date().getTime(); saveToStorage(); updateTable(); } }
    function del(i) { if(i>-1) { bossList.splice(i, 1); saveToStorage(); updateTable(); } }
    /* 修正 */ function clearAll() { if(confirm("確定清空嗎？")) { bossList=[]; saveToStorage(); updateTable(); } }
    function exportData() { if(!bossList.length)return; var b64=btoa(encodeURIComponent(JSON.stringify(bossList))); document.getElementById('syncCode').value=b64; document.getElementById('syncCode').select(); document.execCommand('copy'); alert("📋 代碼已複製！"); }
    function importData() { var code=document.getElementById('syncCode').value.trim(); if(!code)return; try{ var list=JSON.parse(decodeURIComponent(atob(code))); if(Array.isArray(list)){ if(confirm("要覆蓋嗎？")){ bossList=list; saveToStorage(); updateTable(); alert("📥 匯入成功！"); document.getElementById('syncCode').value=""; } } }catch(e){alert("解析失敗");} }
    function saveToStorage() { localStorage.setItem('ms_boss_timers', JSON.stringify(bossList)); }
</script>
</body>
</html>
