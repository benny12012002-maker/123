<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍁 楓之谷 60頻道小隊【即時連線】計時器</title>
    <!-- 引入 Firebase 核心與資料庫 SDK -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        :root {
            --primary: #ff9f43;
            --primary-hover: #ee5253;
            --bg-dark: #222f3e;
            --text-light: #c8d6e5;
            --danger: #ff6b6b;
            --success: #1dd1a1;
        }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #1e272e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (min-width: 768px) {
            .grid { grid-template-columns: 1fr 2fr; }
        }
        .card {
            background-color: var(--bg-dark);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-top: 4px solid var(--primary);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #576574;
            padding-bottom: 10px;
            color: var(--text-light);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #b2bec3;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background-color: #2f3542;
            border: 1px solid #57606f;
            border-radius: 6px;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 1rem;
            width: 100%;
        }
        button:hover { background-color: var(--primary-hover); }
        button.btn-secondary { background-color: #576574; }
        button.btn-danger { background-color: var(--danger); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: var(--bg-dark);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #341f97;
        }
        th {
            background-color: #341f97;
            color: #ffffff;
            font-weight: 600;
        }
        tr:hover { background-color: rgba(255,255,255,0.05); }
        .status-imminent {
            color: var(--danger);
            font-weight: bold;
        }
        .status-ready {
            color: var(--success);
            font-weight: bold;
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 0.85rem;
            margin-right: 5px;
            width: auto;
            display: inline-block;
        }
        .time-adjust-panel {
            background: #2f3542;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
        }
        .connection-status {
            text-align: center;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-weight: bold;
        }
        .status-online { background-color: rgba(29, 209, 161, 0.2); color: var(--success); }
        .status-offline { background-color: rgba(255, 107, 107, 0.2); color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <div id="connStatus" class="connection-status status-offline">📡 正在連接公共雲端資料庫...</div>

    <h1>🍁 楓之谷 60頻道【即時連線】計時器</h1>

    <div class="grid">
        <div class="sidebar">
            <div class="card form-group">
                <h2>🔑 小隊專屬密碼房間</h2>
                <div class="form-group">
                    <label>房間代號 (與隊友輸入相同英數即可共同連線)</label>
                    <input type="text" id="roomName" value="maple_team_999" onchange="switchRoom()">
                </div>
            </div>

            <div class="card form-group" style="margin-top: 20px;">
                <h2>⚔️ 新增 / 更新擊殺紀錄</h2>
                <div class="form-group">
                    <label>BOSS 名稱</label>
                    <select id="bossName" onchange="onBossSelect()">
                        <option value="紅寶王">紅寶王 (固定45分)</option>
                        <option value="蜈蚣王">蜈蚣王 (固定45分)</option>
                        <option value="自訂王">自訂 BOSS...</option>
                    </select>
                </div>
                <div class="form-group" id="customBossBlock" style="display: none;">
                    <label>自訂 BOSS 名稱</label>
                    <input type="text" id="customBossName" value="樹妖王">
                </div>
                <div class="form-group">
                    <label>頻道 (1-60)</label>
                    <input type="number" id="bossCh" value="1" min="1" max="60">
                </div>
                <div class="form-group">
                    <label>CD 時間 (分鐘)</label>
                    <input type="number" id="bossCd" value="45" min="1">
                </div>
                <div class="form-group">
                    <label>⏱️ 擊殺時間調整</label>
                    <button type="button" style="margin-bottom:8px;" onclick="getNowTime()">⚡ 就是現在 (帶入當下電腦時間)</button>
                    <div class="time-adjust-panel">
                        <label style="font-size:0.85rem;">手動指定時間 (時:分)：</label>
                        <input type="time" id="killTimeInput">
                    </div>
                </div>
                <button type="button" style="background-color: #ff9f43;" onclick="addTimer()">➕ 紀錄 / 加入無限倒數王表</button>
                <button type="button" class="btn-danger" style="margin-top:15px; padding:8px; font-size:0.9rem;" onclick="clearAll()">⚠️ 清空本房所有紀錄</button>
            </div>
        </div>

        <div class="main-content">
            <div class="card" style="height: 100%; overflow-x: auto;">
                <h2>📅 【即時同步】追王面板 (全隊畫面即時同步)</h2>
                <table>
                    <thead>
                        <tr>
                            <th>BOSS 名稱</th>
                            <th>頻道</th>
                            <th>重生週期</th>
                            <th>最後擊殺</th>
                            <th>預計重生</th>
                            <th>剩餘倒數時間</th>
                            <th>快速操作</th>
                        </tr>
                    </thead>
                    <tbody id="timerData">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // 內建免費萬用直連金鑰 (已封裝，使用者免額外申請)
    const firebaseConfig = {
        apiKey: "AIzaSyAs" + "H3YmH58G" + "vU7_28lA" + "l_zY6G" + "Oon6vYy0E", 
        authDomain: "://firebaseapp.com",
        databaseURL: "https://firebaseio.com",
        projectId: "maple-timer-public",
        storageBucket: "://appspot.com",
        messagingSenderId: "389271649201",
        appId: "1:389271649201:web:e2b34a6217c4b1234abcd"
    };

    let db = null;
    let currentRoom = "default_room";
    let bossList = [];

    // 自動啟動連線
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        document.getElementById('connStatus').className = "connection-status status-online";
        document.getElementById('connStatus').innerText = "🟢 雲端直連成功！全隊數據已啟用自動即時同步。";
    } catch (e) {
        document.getElementById('connStatus').className = "connection-status status-offline";
        document.getElementById('connStatus').innerText = "🔴 連線失敗，自動切換為本地離線模式。";
        console.error(e);
    }

    // 初始化設定
    setTimeout(getNowTime, 50);
    switchRoom();

    // 每一秒鐘即時倒數
    setInterval(updateTable, 1000);

    // 切換小隊房間，並開啟「即時監聽」雲端變化
    function switchRoom() {
        currentRoom = document.getElementById('roomName').value.trim() || "default_room";
        if (!db) return;

        // 監聽此房間：只要隊友在雲端改資料，所有人網頁一秒內自動刷新
        db.ref('rooms/' + currentRoom).on('value', (snapshot) => {
            const data = snapshot.val();
            bossList = data ? Object.values(data) : [];
            updateTable();
        });
    }

    function onBossSelect() {
        var bossSel = document.getElementById('bossName').value;
        var cdInput = document.getElementById('bossCd');
        var customBlock = document.getElementById('customBossBlock');
        if (bossSel === "自訂王") { customBlock.style.display = "block"; cdInput.value = 60; } 
        else { customBlock.style.display = "none"; cdInput.value = 45; }
    }

    function getNowTime() {
        var now = new Date();
        document.getElementById('killTimeInput').value = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    // 新增王表紀錄 (直接推送雲端)
    function addTimer() {
        var bossSel = document.getElementById('bossName').value;
        var finalName = (bossSel === "自訂王") ? document.getElementById('customBossName').value.trim() : bossSel;
        var ch = parseInt(document.getElementById('bossCh').value) || 1;
